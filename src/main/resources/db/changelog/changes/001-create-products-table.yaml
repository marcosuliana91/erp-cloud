databaseChangeLog:
  - changeSet:
      id: 001-create-products-table
      author: erp-cloud
      comment: "Create products table with all required fields"
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(60)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: integration_code
                  type: varchar(60)
              - column:
                  name: description
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: detailed_description
                  type: text
              - column:
                  name: unit
                  type: varchar(6)
                  constraints:
                    nullable: false
              - column:
                  name: ncm_code
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: ean_code
                  type: varchar(14)
              - column:
                  name: type
                  type: varchar(20)
                  constraints:
                    nullable: false
                  defaultValue: PRODUCT
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
                  defaultValue: ACTIVE
              - column:
                  name: brand
                  type: varchar(100)
              - column:
                  name: model
                  type: varchar(100)
              - column:
                  name: family
                  type: varchar(100)
              - column:
                  name: unit_price
                  type: decimal(19,4)
                  defaultValueNumeric: 0
              - column:
                  name: cost_price
                  type: decimal(19,4)
                  defaultValueNumeric: 0
              - column:
                  name: gross_weight
                  type: decimal(15,4)
                  defaultValueNumeric: 0
              - column:
                  name: net_weight
                  type: decimal(15,4)
                  defaultValueNumeric: 0
              - column:
                  name: height
                  type: decimal(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: width
                  type: decimal(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: depth
                  type: decimal(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: internal_notes
                  type: text
              - column:
                  name: stock_quantity
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: minimum_stock
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 001-create-products-indexes
      author: erp-cloud
      comment: "Create indexes for products table"
      changes:
        - createIndex:
            tableName: products
            indexName: idx_products_code
            unique: true
            columns:
              - column:
                  name: code
        - createIndex:
            tableName: products
            indexName: idx_products_integration_code
            columns:
              - column:
                  name: integration_code
        - createIndex:
            tableName: products
            indexName: idx_products_description
            columns:
              - column:
                  name: description
        - createIndex:
            tableName: products
            indexName: idx_products_family
            columns:
              - column:
                  name: family
        - createIndex:
            tableName: products
            indexName: idx_products_brand
            columns:
              - column:
                  name: brand
        - createIndex:
            tableName: products
            indexName: idx_products_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: products
            indexName: idx_products_ncm_code
            columns:
              - column:
                  name: ncm_code
        - createIndex:
            tableName: products
            indexName: idx_products_type
            columns:
              - column:
                  name: type

  - changeSet:
      id: 001-add-products-check-constraints
      author: erp-cloud
      comment: "Add check constraints for products table"
      changes:
        - sql:
            sql: |
              ALTER TABLE products ADD CONSTRAINT chk_products_type
              CHECK (type IN ('PRODUCT', 'SERVICE', 'RAW_MATERIAL', 'CONSUMABLE', 'ASSET'));
        - sql:
            sql: |
              ALTER TABLE products ADD CONSTRAINT chk_products_status
              CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISCONTINUED'));
        - sql:
            sql: |
              ALTER TABLE products ADD CONSTRAINT chk_products_unit_price_non_negative
              CHECK (unit_price >= 0);
        - sql:
            sql: |
              ALTER TABLE products ADD CONSTRAINT chk_products_cost_price_non_negative
              CHECK (cost_price >= 0);
        - sql:
            sql: |
              ALTER TABLE products ADD CONSTRAINT chk_products_stock_quantity_non_negative
              CHECK (stock_quantity >= 0);
        - sql:
            sql: |
              ALTER TABLE products ADD CONSTRAINT chk_products_minimum_stock_non_negative
              CHECK (minimum_stock >= 0);
